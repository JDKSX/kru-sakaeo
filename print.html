<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>พิมพ์ข้อสอบ · ติวครูผู้ช่วย คอมฯ สระแก้ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
@page{size:A4;margin:13mm 14mm 15mm}
*{box-sizing:border-box}
html,body{margin:0;background:#E9EBEF;color:#000}
body{font-family:"Sarabun","Noto Sans Thai",sans-serif;font-size:11.5pt;line-height:1.5}
.toolbar{position:sticky;top:0;z-index:5;background:#111A3A;color:#fff;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
.toolbar button,.toolbar a{font:700 14px "Sarabun",sans-serif;background:#F0C063;color:#111A3A;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none}
.toolbar a.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.toolbar span{opacity:.85}
.paper{max-width:210mm;margin:12px auto;background:#fff;padding:13mm 14mm;box-shadow:0 1px 4px rgba(0,0,0,.15)}
@media (max-width:820px){.paper{padding:16px}}
@media print{html,body{background:#fff}.toolbar{display:none}.paper{margin:0;padding:0;box-shadow:none;max-width:none}}
h1{font-size:15pt;margin:0}
.head{border:1.2pt solid #000;padding:3mm 4mm;display:grid;gap:2mm;margin-bottom:4mm}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:3mm;font-size:10.5pt}
.fields span{border-bottom:.6pt dotted #000;padding-bottom:1mm}
.rule{font-size:10pt}
.sec-title{font-weight:700;font-size:12.5pt;border-bottom:1.2pt solid #000;margin:5mm 0 1mm;padding-bottom:1mm;break-after:avoid}
.q{break-inside:avoid;padding:2.2mm 0 2.6mm;border-bottom:.4pt solid #bbb}
.s{display:grid;grid-template-columns:10mm 1fr}
.n{font-weight:700}
.ps{border:.6pt solid #888;padding:1.5mm 2.5mm;margin:1mm 0 1.5mm 10mm;font-size:10.8pt;white-space:pre-wrap}
pre{font-family:"IBM Plex Mono",Menlo,monospace;font-size:9.5pt;margin:1mm 0 1.5mm 10mm;padding:1.5mm 2.5mm;border-left:2pt solid #000;background:#f2f2f2;white-space:pre-wrap;overflow-wrap:anywhere}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:.5mm 6mm;margin-left:10mm}
.ch.long{grid-template-columns:1fr}
.ch div{display:grid;grid-template-columns:6mm 1fr;overflow-wrap:anywhere}
.sheet{break-before:page}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 5mm;margin-top:3mm}
.row{display:grid;grid-template-columns:9mm repeat(4,1fr);align-items:center;height:4.5mm;font-size:8.5pt}
.row b{font-size:8.5pt}
.bub{width:4.2mm;height:4.2mm;border:.7pt solid #000;border-radius:50%;display:grid;place-items:center;font-size:6.5pt}
.grid.big{grid-template-columns:repeat(2,1fr);gap:0 10mm}
.grid.big .row{height:7.4mm;font-size:10.5pt}.grid.big .row b{font-size:10.5pt}.grid.big .bub{width:6.2mm;height:6.2mm;font-size:8.5pt}
.keytab{display:grid;grid-template-columns:repeat(10,1fr);border-top:.6pt solid #000;border-left:.6pt solid #000;margin-bottom:4mm;font-size:9.5pt}
.keytab span{border-right:.6pt solid #000;border-bottom:.6pt solid #000;padding:.6mm 1mm;text-align:center}
.ans{font-weight:700;margin-left:10mm}
.why{margin:.5mm 0 0 10mm;font-size:10pt}
.why div{display:grid;grid-template-columns:6mm 1fr}
.why .ok{font-weight:700}
.tip{margin:1mm 0 0 10mm;font-size:10pt;border-left:2pt solid #000;padding-left:2mm}
.foot{font-size:9pt;color:#444;margin-top:3mm}
</style>
</head>
<body>
<div class="toolbar"><button type="button" id="pr">พิมพ์ / บันทึก PDF</button><a class="sec" href="index.html#exams">กลับหน้าข้อสอบ</a><span>ตั้งค่าตอนพิมพ์: กระดาษ A4 · ขอบ "ค่าเริ่มต้น" · ปิดหัวกระดาษและท้ายกระดาษ</span></div>
<div class="paper" id="paper">กำลังโหลด…</div>
<script src="common.js"></script>
<script>
document.getElementById("pr").onclick=()=>window.print();
(async function(){
  const qs=new URLSearchParams(location.search),cid=qs.get("c"),part=qs.get("p")||"A",mode=qs.get("m")||"exam";
  const M=await loadManifest(),c=M.collections.find(x=>x.id===cid),P=document.getElementById("paper");
  if(!c){P.textContent="ไม่พบชุดข้อสอบนี้";return}
  const items=partItems(await loadCollection(cid),part),N=items.length,mins=c.kind==="full"?(part==="A"?"ตามเวลาจริง 09.00–16.30 น. (คิดวิเคราะห์ 150 นาที · อังกฤษ 90 นาที · ข้าราชการที่ดี 60 นาที)":"ตามเวลาจริง 09.00–16.00 น. (วิชาเอก 150 นาที · การสอน 90 นาที · กฎหมาย 30 นาที)"):Math.ceil(N*1.5)+" นาที";
  const title=`${c.title} · ${c.parts[part].label}`;
  document.title=(mode==="key"?"เฉลย ":"ข้อสอบ ")+title;
  let h="",cur="";
  const body=(q,i)=>`<div class="s"><span class="n">${i+1}.</span><span>${q.q}</span></div>${q.ps?`<div class="ps">${esc(q.ps)}</div>`:""}${q.code?`<pre>${esc(q.code)}</pre>`:""}`;
  const secHead=q=>{if(q.s===cur)return"";cur=q.s;return `<div class="sec-title">${SUBJ[q.s][1]}</div>`};
  if(mode==="exam"){
    h+=`<div class="head"><h1>แบบทดสอบฝึก · ${esc(title)}</h1><div class="fields"><span>ชื่อ</span><span>วันที่</span><span>${N} ข้อ</span></div><div class="rule">เวลา ${mins} · เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว แล้วระบายในกระดาษคำตอบท้ายชุด · ขีด ✗ ตัดตัวเลือกบนข้อสอบได้</div></div>`;
    items.forEach((q,i)=>{const o=orderOf(q),long=o.some(ci=>String(q.c[ci]).length>32)||(q.code&&o.some(ci=>String(q.c[ci]).length>18));
      h+=secHead(q)+`<div class="q">${body(q,i)}<div class="ch${long?" long":""}">${o.map((ci,pos)=>`<div><span>${TH[pos]}.</span><span>${esc(q.c[ci])}</span></div>`).join("")}</div></div>`});
    const rows=a=>a.map(n=>`<div class="row"><b>${n}.</b>${TH.map(t=>`<span class="bub">${t}</span>`).join("")}</div>`).join("");
    const nums=[...Array(N)].map((_,i)=>i+1),big=N<=60,cols=big?2:4,per=Math.ceil(N/cols);
    h+=`<div class="sheet"><div class="head"><h1>กระดาษคำตอบ · ${esc(title)}</h1><div class="fields"><span>ชื่อ</span><span>วันที่</span><span>คะแนน ____ / ${N}</span></div><div class="rule">ระบายวงกลมให้เต็ม · ตรวจเองที่เว็บ เมนู "ตรวจกระดาษคำตอบ" หรือถ่ายรูปหน้านี้ส่งให้ Claude ตรวจ</div></div><div class="grid${big?" big":""}">${[...Array(cols)].map((_,k)=>`<div>${rows(nums.slice(k*per,(k+1)*per))}</div>`).join("")}</div></div>`;
  }else{
    h+=`<div class="head"><h1>เฉลยและคำอธิบาย · ${esc(title)}</h1><div class="rule">ตรวจคำตอบก่อน แล้วค่อยอ่านเหตุผลของข้อที่ผิด · ลำดับตัวเลือกตรงกับข้อสอบชุดนี้และบนเว็บ</div></div>`;
    h+=`<div class="keytab">${items.map((q,i)=>`<span>${i+1}. ${TH[keyOf(q)]}</span>`).join("")}</div>`;
    items.forEach((q,i)=>{const o=orderOf(q);h+=secHead(q)+`<div class="q">${body(q,i)}<div class="ans">ตอบ ${TH[keyOf(q)]}. ${esc(q.c[q.a])}</div><div class="why">${o.map((ci,pos)=>`<div class="${ci===q.a?"ok":""}"><span>${TH[pos]}.</span><span>${esc(q.n[ci])}</span></div>`).join("")}</div><div class="tip">เทคนิค · ${esc(q.tip)}</div></div>`});
    h+=`<div class="foot">ข้อสอบชุดนี้เขียนขึ้นเพื่อฝึกรูปแบบการพลิกโจทย์ ไม่ใช่ข้อสอบจริง</div>`;
  }
  P.innerHTML=h;
})().catch(()=>{document.getElementById("paper").textContent="โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง"});
</script>
</body>
</html>
