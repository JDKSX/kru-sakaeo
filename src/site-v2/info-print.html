<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ข้อมูลวันสอบ · ครูผู้ช่วย 2569 สพม.สระแก้ว</title>
<meta name="theme-color" content="#132A66">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Trirong:wght@600&family=Sarabun:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="ks-ds.css">
<style>
@page{size:A4;margin:0}
body{background:var(--surface-2)}
/* แถบเครื่องมือ (สไตล์เดียวกับ print.html) */
.tb{position:sticky;top:0;z-index:10;background:var(--primary-deep);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) var(--cpad) 10px;display:grid;gap:10px}
.tb .r1{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tb .ttl{display:grid;line-height:1.3;min-width:0}
.tb .ttl b{font:600 1.05rem var(--serif)}
.tb .ttl small{color:var(--rail-muted);font-size:var(--fs-2)}
.tb .r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb .btn{min-height:40px}
.tb .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.tb .info{font-size:var(--fs-1);color:var(--rail-muted)}
.stage{padding:16px 12px 40px}
.state{max-width:560px;margin:40px auto}
/* หน้ากระดาษ A4 */
.pw{margin:0 auto 14px;position:relative}
.page{width:210mm;height:296.8mm;background:#fff;color:#000;box-shadow:var(--sh-2);transform-origin:top left;display:flex;flex-direction:column;padding:12mm 13mm 10mm;overflow:hidden;font-family:"Sarabun","Noto Sans Thai",sans-serif;font-size:11pt;line-height:1.45}
.pg-h{display:flex;justify-content:space-between;gap:4mm;font-size:8.5pt;color:#333;border-bottom:.5pt solid #777;padding-bottom:1.2mm;margin-bottom:3mm}
.pg-b{flex:1;min-height:0;position:relative;overflow:hidden}
.pg-b>:first-child{margin-top:0}
.pg-f{text-align:center;font-size:8.5pt;color:#333;padding-top:2mm}
.page h1,.page h2,.page h3{font-family:"Sarabun","Noto Sans Thai",sans-serif;font-weight:700;margin:0;text-wrap:wrap;color:#000}
.page a{color:#000;text-decoration:underline}
/* เนื้อหา */
.hd{border:1.1pt solid #000;padding:2.8mm 3.6mm;display:grid;gap:1mm;margin-bottom:3.5mm}
.hd h1{font-size:17pt;line-height:1.3}
.hd .rule{font-size:10pt}
.me{border:1.1pt solid #000;padding:2.4mm 3.6mm 3mm;margin:0 0 3mm}
.me h2{font-size:12pt;line-height:1.3;margin-bottom:1.5mm}
.mfs{display:grid;grid-template-columns:2.2fr 1fr 1fr;gap:3.5mm}
.mf{min-width:0}
.mf small{display:block;font-size:9pt;color:#222;line-height:1.3}
.mv{display:block;min-height:8.5mm;padding-top:1.6mm;border-bottom:.6pt dotted #000;font-weight:700;font-size:13pt;line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sc{font-size:12.5pt;line-height:1.3;border-bottom:1.1pt solid #000;padding:0 0 .8mm;margin:4.5mm 0 2mm}
.hg{margin:2.6mm 0 1.2mm}
.hg h3{font-size:11pt;line-height:1.35}
.hg .dt{margin:0;font-size:10pt}
.li{display:grid;grid-template-columns:4.4mm 1fr;margin:0 0 1.1mm}
.li .d{width:1.4mm;height:1.4mm;border-radius:50%;background:#000;margin:2.2mm 0 0 1.3mm}
.ck{display:grid;grid-template-columns:7mm 1fr;margin:0 0 1.6mm}
.ck .bx{width:4mm;height:4mm;border:.9pt solid #000;margin-top:.9mm}
.ck small{display:block;font-size:9.6pt;line-height:1.4;color:#222}
.sub{margin:2mm 0 1.2mm;font-size:10pt}
.tw{margin:0 0 2.4mm}
.tbl{width:100%;border-collapse:collapse;font-size:10.5pt;line-height:1.4}
.tbl th,.tbl td{border:.7pt solid #000;padding:1mm 2mm;vertical-align:top;text-align:left}
.tbl th{font-weight:700}
.tbl td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th:last-child,.tbl td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.nt{border:1pt solid #000;padding:2mm 3mm;margin:2mm 0 2.4mm}
.nt.bad{border-width:2pt}
.nt.tip{border-style:dashed}
.nt p{margin:0 0 1mm}
.nt p:last-child,.nt .li:last-child{margin-bottom:0}
.nt .nt-t{font-weight:700;margin-bottom:1mm}
.rg{display:grid;grid-template-columns:9mm 1fr;margin:0 0 1mm}
.rg b{font-variant-numeric:tabular-nums}
.ft{font-size:9pt;line-height:1.4;color:#222;margin:2.4mm 0 0}
@media print{
  body{background:#fff}
  .tb,.state{display:none!important}
  .stage{padding:0}
  .pw{width:auto!important;height:auto!important;margin:0}
  .page{transform:none!important;box-shadow:none;break-after:page}
  .pw:last-child .page{break-after:auto}
}
</style>
</head>
<body>
<div class="tb" role="toolbar" aria-label="เครื่องมือพิมพ์">
  <div class="r1">
    <div class="ttl"><b id="ttl">ข้อมูลวันสอบ</b><small>ครูผู้ช่วย 2569 สพม.สระแก้ว</small></div>
    <div class="r2"><button type="button" class="btn acc" id="pr"><i class="ph ph-printer" aria-hidden="true"></i>พิมพ์ / บันทึก PDF</button><a class="btn ghost" id="back" href="index.html#info"><i class="ph ph-arrow-left" aria-hidden="true"></i>กลับ</a></div>
  </div>
  <div class="r2"><span class="info" id="info" role="status"></span></div>
</div>
<main class="stage" id="stage"><div class="state card pad"><div class="skel" style="height:20px"></div></div></main>
<script src="common.js"></script>
<script src="info-data.js"></script>
<script>
const stage=document.getElementById("stage");
const mm=v=>v*96/25.4;
const HDR="ข้อมูลวันสอบ · ครูผู้ช่วย 2569 สพม.สระแก้ว";
document.getElementById("pr").onclick=()=>window.print();
function fit(){
  const cs=getComputedStyle(stage),avail=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const k=Math.min(1,avail/mm(210));
  stage.querySelectorAll(".pw").forEach(w=>{w.style.width=mm(210)*k+"px";w.style.height=mm(296.8)*k+"px";w.firstElementChild.style.transform=k<1?`scale(${k})`:""});
}
addEventListener("resize",fit);

function newPage(pageNo){
  const w=document.createElement("div");w.className="pw";
  const p=document.createElement("section");p.className="page";p.setAttribute("aria-label","หน้า "+pageNo);
  p.innerHTML=`<div class="pg-h"><span>${esc(HDR)}</span></div><div class="pg-b"></div><div class="pg-f">หน้า ${pageNo}</div>`;
  w.appendChild(p);stage.appendChild(w);
  return p;
}
/* ไหลบล็อกลงหน้าทีละหน้า วัดความสูงจริง · บล็อกที่มี .kn (หัวข้อ) ห้ามค้างท้ายหน้า ต้องไปพร้อมบล็อกถัดไป */
function flow(blocks){
  let pageNo=0,body;const tall=[];
  const open=()=>{pageNo++;body=newPage(pageNo).querySelector(".pg-b")};
  const over=()=>{const l=body.lastElementChild;return !!l&&l.offsetTop+l.offsetHeight>body.clientHeight-1};
  open();
  for(const el of blocks){
    body.appendChild(el);
    if(!over())continue;
    if(body.children.length>1){
      body.removeChild(el);
      const carry=[];
      while(body.children.length>1&&body.lastElementChild.kn){const x=body.lastElementChild;body.removeChild(x);carry.unshift(x)}
      open();carry.forEach(x=>body.appendChild(x));body.appendChild(el);
      if(over())tall.push({page:pageNo,text:el.textContent.slice(0,40)});
    }else tall.push({page:pageNo,text:el.textContent.slice(0,40)});
  }
  const total=pageNo;stage.querySelectorAll(".pg-f").forEach((f,i)=>f.textContent=`หน้า ${i+1} / ${total}`);
  window.__ip={pages:total,tall};
  return total;
}
const el=(tag,cls,html,kn)=>{const d=document.createElement(tag);if(cls)d.className=cls;d.innerHTML=html;if(kn)d.kn=true;return d};
const liIn=x=>`<i class="d" aria-hidden="true"></i><span>${x}</span>`;
const lis=a=>a.map(x=>`<div class="li">${liIn(x)}</div>`).join("");
const liEl=x=>el("div","li",liIn(x));
const note=b=>el("div","nt "+b.kind,b.title?`<div class="nt-t">${b.title}</div>${lis(b.items)}${(b.paras||[]).map(p=>`<p>${p}</p>`).join("")}`:b.items?lis(b.items):`<p>${b.text}</p>`);
const ck=([,,t,s])=>el("div","ck",`<i class="bx" aria-hidden="true"></i><div><span>${t}</span>${s?`<small>${s}</small>`:""}</div>`);
const table=rs=>el("div","tw",`<table class="tbl"><thead><tr>${INFO.tblHead.map(h=>`<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
/* ข้อมูลของฉัน: ใช้ค่าที่บันทึกไว้ในเครื่องนี้ (ks-me) ถ้าไม่มี = เส้นประให้เขียนเอง */
function meBlock(){
  const m0=store.get("ks-me",null),m=m0&&typeof m0==="object"?m0:{};
  return el("div","me",`<h2>${INFO.me.title}</h2><div class="mfs">${INFO.me.fields.map(([k,l])=>{const v=String(m[k]||"");return `<div class="mf"><small>${l}</small><span class="mv">${v?esc(v):""}</span></div>`}).join("")}</div>`);
}
const body={
  ul:b=>b.items.map(liEl),
  note:b=>[note(b)],
  h3:b=>[el("div","hg",`<h3>${b.text}</h3>`,true)],
  reg:b=>b.items.map(([n,t])=>el("div","rg",`<b>${n}</b><span>${t}</span>`)),
  sched:b=>b.parts.flatMap(p=>[el("div","hg",`<h3>${p.title}</h3><p class="dt">${p.date}</p>`,true),table(p.rows)]),
  phases:b=>b.items.flatMap((p,i)=>[el("div","hg",`<h3>${i+1}) ${p.title}</h3>`,true),...p.items.map(liEl)]),
  prep:()=>[...INFO.prep.items.filter(p=>p[1]).map(ck),el("p","sub",INFO.prep.recTitle,true),...INFO.prep.items.filter(p=>!p[1]).map(ck),el("p","sub",INFO.prep.foot)]
};
function build(){
  const out=[el("div","hd",`<h1>${INFO.title}</h1><div class="rule">${INFO.sub}</div>`)];
  for(const b of INFO.blocks){
    if(b.k==="me")out.push(meBlock());
    else if(b.k==="sec"){if(b.noprint)continue;out.push(el("h2","sc",b.title,true));b.body.forEach(x=>out.push(...body[x.k](x)))}
    else out.push(note(b));
  }
  out.push(el("p","ft",INFO.foot),el("p","ft",INFO.ref));
  return out;
}
const overflow=()=>[...stage.querySelectorAll(".pg-b")].some(c=>{const l=c.lastElementChild;return !!l&&l.offsetTop+l.offsetHeight>c.clientHeight+1});
let tries=0;
async function render(){
  stage.innerHTML="";
  /* โหลดฟอนต์ไทยก่อนวัดความสูง ไม่งั้นจัดหน้าด้วยฟอนต์สำรองแล้วล้นตอนพิมพ์ */
  await Promise.all([['400 11pt Sarabun','กขคง ข้อ ศึกษา Aa1'],['700 11pt Sarabun','กขคง ข้อ ศึกษา Aa1']].map(([f,s])=>document.fonts.load(f,s).catch(()=>0)));
  await document.fonts.ready;
  const pages=flow(build());
  document.getElementById("info").textContent=`${pages} หน้า A4`;
  fit();
}
/* ถ้าฟอนต์โหลดเสร็จทีหลังจนเนื้อหาล้นหน้า ให้จัดหน้าใหม่ (สูงสุด 3 ครั้ง) */
const recheck=()=>{if(tries<3&&overflow()){tries++;render()}};
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener("loadingdone",()=>setTimeout(recheck,60));
render().then(()=>setTimeout(recheck,1500));
</script>
</body>
</html>
