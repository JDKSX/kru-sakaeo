<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ติวครูผู้ช่วย คอมฯ สระแก้ว</title>
<meta name="theme-color" content="#111A3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* exam-room palette: navy ink + gold highlighter; question cards = answer-sheet rows with OMR bubbles */
:root{
  --paper:#F4F5F8; --sheet:#FFFFFF; --ink:#151A2B; --muted:#5C6478; --line:#DCE0E8;
  --navy:#111A3A; --gold:#C9921E; --gold-soft:#FBF1DC;
  --ok:#16794A; --ok-soft:#E2F3EA; --bad:#B3261E; --bad-soft:#FBE7E5; --cut:#9AA1B2;
  --f-head:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0F1322; --sheet:#171C2E; --ink:#E7EAF2; --muted:#9AA2B8; --line:#2A3148;
  --navy:#C9D3F5; --gold:#F0C063; --gold-soft:#3A3018;
  --ok:#5CC890; --ok-soft:#173326; --bad:#F2867D; --bad-soft:#3B1D1B; --cut:#646C84; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--f-head);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:inherit}
b{font-weight:600}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-head);font-size:.78rem;letter-spacing:.08em;font-weight:600;color:var(--gold)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px}
.stack{display:grid;gap:12px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 0 0}
@media (prefers-color-scheme: dark){header.top{background:#0A0E1C}}
header.top .wrap{padding-bottom:0;display:grid;gap:10px}
header.top h1{color:#fff}
header.top .eyebrow{color:#F0C063}
.cd{font-family:var(--f-head);font-size:.95rem;color:rgba(255,255,255,.8)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
nav.tabs a{font:600 .95rem var(--f-head);text-decoration:none;color:rgba(255,255,255,.65);padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:#fff;border-bottom-color:#F0C063}
main{padding-top:18px}

/* home */
.today{padding:16px;display:grid;gap:8px;border-left:4px solid var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid2>*{min-width:0}
.stat{padding:12px 14px}
.stat b{display:block;font-family:var(--f-head);font-size:1.5rem;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}

/* exam list */
.coll{padding:14px 16px;display:grid;gap:10px}
.coll .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.parts{display:grid;gap:8px}
.part{display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.part .lbl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-head);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 .88rem var(--f-head);border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer;text-decoration:none;min-height:40px}
.btn.pri{background:var(--navy);color:var(--sheet);border-color:var(--navy)}
.btn[aria-pressed="true"]{background:var(--navy);color:var(--sheet);border-color:var(--navy)}
.score-chip{font-family:var(--f-head);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score-chip.pass{color:var(--ok)} .score-chip.fail{color:var(--bad)}
.pending{color:var(--muted);font-size:.9rem}

/* quiz */
.bar{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4}
.score{font-family:var(--f-head);font-variant-numeric:tabular-nums}
.score b{font-size:1.25rem;color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 .85rem var(--f-head);border:1px solid var(--line);background:var(--sheet);color:var(--muted);padding:5px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
.hint{font-size:.88rem;color:var(--muted)}
.q{padding:16px;display:grid;gap:12px}
.q .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--f-head);font-size:.78rem}
.q .num{font-weight:700;color:var(--muted);margin-right:2px}
.tag{border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--muted)}
.tag.pt{border-color:var(--gold);color:var(--gold)}
.passage{background:var(--paper);border-radius:8px;padding:10px 12px;font-size:.95rem;white-space:pre-wrap}
pre.code{margin:0;background:var(--paper);border-radius:8px;padding:10px 12px;font:500 .88rem/1.55 var(--f-mono);overflow-x:auto}
.choices{display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;min-width:0}
.ch:disabled{cursor:default}
.ch .txt{min-width:0;display:grid;gap:3px;overflow-wrap:anywhere}
.ch .note{font-size:.86rem;color:var(--muted);line-height:1.45}
.bub{flex:none;width:1.7em;height:1.7em;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-head);font-size:.8rem;font-weight:600;color:var(--muted)}
.cut{font:600 .78rem var(--f-head);border:1px dashed var(--line);background:none;color:var(--muted);border-radius:8px;padding:9px;cursor:pointer}
.row.isCut .txt>span:first-child{text-decoration:line-through;color:var(--cut)}
.row.isCut .bub{border-color:var(--cut);color:var(--cut)}
.row.isCut .cut{border-style:solid;color:var(--bad)}
.ch.right{background:var(--ok-soft);border-color:var(--ok)}
.ch.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.ch.pick.wrong{background:var(--bad-soft);border-color:var(--bad)}
.ch.pick.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.ch.right .note{color:var(--ok)}
.tip{font-size:.92rem;background:var(--gold-soft);border-radius:8px;padding:8px 12px}
.tip b{color:var(--gold)}
.res{font-family:var(--f-head);font-weight:600}
.res.ok{color:var(--ok)} .res.no{color:var(--bad)}

/* grade */
textarea{width:100%;min-height:140px;font:500 1rem var(--f-mono);border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--sheet);color:var(--ink)}
.subj{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meter{grid-column:1/-1;height:8px;background:var(--paper);border-radius:99px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:99px}
.meter i.low{background:var(--bad)}
.meter::after{content:"";position:absolute;left:60%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
details.wq{border-top:1px solid var(--line);padding:10px 0}
details.wq summary{cursor:pointer;font-family:var(--f-head)}

/* plan / tech / sheets */
.day{display:grid;grid-template-columns:auto 60px 1fr;gap:10px;align-items:start;padding:12px 14px}
.day input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.day .d{font-family:var(--f-head);font-weight:600;font-size:.88rem;line-height:1.35}
.day .d small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.day .t{min-width:0;display:grid;gap:2px}
.day .sub{font-size:.9rem;color:var(--muted)}
.day.today{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.day.done .t{opacity:.55}
.pat{padding:14px 16px;display:grid;gap:6px}
.pat .how{font-size:.93rem;border-left:3px solid var(--gold);padding-left:10px}
.sheetrow{padding:14px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
footer{margin-top:32px;font-size:.84rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ch{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <div class="eyebrow">ครูผู้ช่วย ปี 2569 · วิชาเอกคอมพิวเตอร์ · สพม.สระแก้ว</div>
      <h1>ติวครูผู้ช่วย คอมฯ สระแก้ว</h1>
      <p class="cd" id="cd">ภาค ก เสาร์ 14 พ.ย. 69 · ภาค ข อาทิตย์ 15 พ.ย. 69</p>
    </div>
    <nav class="tabs" aria-label="เมนู">
      <a href="#home" data-v="home">หน้าหลัก</a><a href="#exams" data-v="exams">ข้อสอบ</a><a href="#sheets" data-v="sheets">ชีทอ่าน</a><a href="#plan" data-v="plan">แผน 19 วัน</a><a href="#tech" data-v="tech">เทคนิค</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"><p class="muted">กำลังโหลด…</p></main>

<script src="common.js"></script>
<script>
let M=null;const cache={};
const PLAN=[
 ["2026-10-26","จ 26 ต.ค.","ลองทำข้อสอบเก่าภาค ก 1 ชุดแบบจับเวลา เพื่อดูว่าเสียคะแนนส่วนไหน","ทำชุดพื้นฐานภาค ก บนเว็บนี้"],
 ["2026-10-27","อ 27 ต.ค.","คิดวิเคราะห์เชิงปริมาณ: อนุกรม ร้อยละ อัตราส่วน","ข้าราชการที่ดี: ระเบียบบริหารราชการแผ่นดิน"],
 ["2026-10-28","พ 28 ต.ค.","เช็กรายชื่อที่ spm-sk.go.th และพิมพ์บัตรผู้เข้าสอบ · คิดวิเคราะห์ภาษาไทย","วิชาเอก: ระบบเลขฐาน ตรรกศาสตร์ดิจิทัล"],
 ["2026-10-29","พฤ 29 ต.ค.","คิดวิเคราะห์เชิงนามธรรม: อุปมาอุปไมย","วิชาเอก: ฮาร์ดแวร์ สถาปัตยกรรม ระบบปฏิบัติการ"],
 ["2026-10-30","ศ 30 ต.ค.","อังกฤษ: tense และ reading","วิชาเอก: อัลกอริทึม flowchart"],
 ["2026-10-31","ส 31 ต.ค.","วิชาเอก: ไล่โค้ด โครงสร้างข้อมูล การเรียงลำดับ","หลักสูตร ว 4.1 / ว 4.2 · ธรรมาภิบาล"],
 ["2026-11-01","อา 1 พ.ย.","วิชาเอก: เครือข่าย ฐานข้อมูล SQL","กฎหมาย: พ.ร.บ.การศึกษาแห่งชาติ และภาคบังคับ"],
 ["2026-11-02","จ 2 พ.ย.","คิดวิเคราะห์: เงื่อนไขภาษา สรุปเหตุผล","จิตวิทยาพัฒนาการ และจิตวิทยาการศึกษา"],
 ["2026-11-03","อ 3 พ.ย.","อังกฤษ: conversation และ cloze","วิชาเอก: ความปลอดภัยไซเบอร์ กฎหมายดิจิทัล"],
 ["2026-11-04","พ 4 พ.ย.","ข้าราชการที่ดี: วิธีปฏิบัติราชการทางปกครอง จริยธรรม","Active Learning, Computational Thinking"],
 ["2026-11-05","พฤ 5 พ.ย.","คิดวิเคราะห์: ตาราง ความเพียงพอของข้อมูล","วิชาเอก: SDLC, AI, IoT"],
 ["2026-11-06","ศ 6 พ.ย.","วัดผล วิจัยในชั้นเรียน ประกันคุณภาพ","กฎหมาย: ข้าราชการครูฯ สภาครูฯ"],
 ["2026-11-07","ส 7 พ.ย.","ทดลองสอบภาค ก ชุดเต็ม 200 ข้อ ตามเวลาจริง 09.00–16.30","ตรวจด้วยหน้า \"ตรวจกระดาษคำตอบ\""],
 ["2026-11-08","อา 8 พ.ย.","ทดลองสอบภาค ข ชุดเต็ม 200 ข้อ ตามเวลาจริง","คุ้มครองเด็ก ปฐมวัย ระเบียบบริหารราชการ ศธ."],
 ["2026-11-09","จ 9 พ.ย.","ซ่อมหมวดที่ได้ต่ำกว่า 60% จากภาค ก","ทำข้อที่ผิดซ้ำ"],
 ["2026-11-10","อ 10 พ.ย.","ซ่อมหมวดที่ได้ต่ำกว่า 60% จากภาค ข","ยุทธศาสตร์ชาติ แผนการศึกษาแห่งชาติ นโยบาย ศธ. ปีปัจจุบัน"],
 ["2026-11-11","พ 11 พ.ย.","ทำชุดเต็มอีก 1 ชุด เฉพาะคิดวิเคราะห์ + อังกฤษ","ทวนวิชาเอก"],
 ["2026-11-12","พฤ 12 พ.ย.","อ่านชีท \"ทวน 1 นาที\" ทุกวิชา","เช็กสถานที่สอบ · จองที่พัก"],
 ["2026-11-13","ศ 13 พ.ย.","เดินทาง · ดูสนามสอบ · ทวนเบา ๆ","นอนก่อน 22.00 น."]
];
const PATS=[
 ["โจทย์ปฏิเสธ","ข้อใดไม่ใช่ / ไม่ถูกต้อง / ยกเว้น","วงกลมคำว่า \"ไม่\" แล้วติ๊ก ✓ ข้อที่ถูก ข้อที่เหลือข้อเดียวคือคำตอบ"],
 ["สลับรายละเอียด","ประโยคคุ้น แต่เปลี่ยนตัวเลข หน่วยงาน หรือมาตราไปคำเดียว","ตรวจทีละคำนามและทีละตัวเลข จำเป็นคู่ เช่น ภายใน = สถานศึกษาทำเอง / ภายนอก = สมศ. ทุก 5 ปี"],
 ["ตัวเลือกผสมข้อ","1,2 / 1,3 / 2,3 / 1,2,3","ตรวจข้อความที่อยู่ในหลายตัวเลือกที่สุดก่อน ผิดแล้วตัดได้หลายตัวเลือกพร้อมกัน"],
 ["สถานการณ์","ควรทำอะไรเป็นอันดับแรก / เหมาะสมที่สุด","ตัดข้อที่ลงโทษก่อน เพิกเฉย หรือโยนให้คนอื่น เลือกข้อที่ลงมือเอง เชิงบวก ตามระบบ และหาสาเหตุก่อนแก้"],
 ["นำไปใช้","ให้สถานการณ์ใหม่แล้วถามว่าเป็นแนวคิดใด","แปลงสถานการณ์เป็นสูตรของแนวคิดก่อน เช่น เสริมแรง: ให้หรือเอาออก + พฤติกรรมเพิ่มหรือลด"],
 ["คำเด็ดขาด","ทุก · เท่านั้น · เสมอ · แน่นอน","โจทย์การสอนและตรรกะ: คำเด็ดขาดที่เกินข้อมูลมักผิด · โจทย์กฎหมาย: คำเด็ดขาดอาจถูก"],
 ["คำนวณ / ไล่โค้ด","ตัวลวงมาจากจุดที่คนมักคิดผิด","เขียนค่าตัวแปรทุกรอบลงกระดาษ ใช้ทางลัดตัดก่อน เช่น บิตท้ายบอกคู่หรือคี่"]
];
function todayISO(){return new Date(Date.now()+7*36e5).toISOString().slice(0,10)}
const scoreKey=(c,p)=>"ks-grade-"+c+"-"+p;

/* ---------- views ---------- */
async function vHome(){
  const t=todayISO(),i=PLAN.findIndex(p=>p[0]===t),done=store.get("ks-plan",{});
  const today=i>=0?PLAN[i]:null;
  const ans=store.get("ks-ans",{}),n=Object.keys(ans).length;
  const fulls=M.collections.filter(c=>c.kind==="full");
  return `<div class="stack">
  ${today?`<div class="card today"><span class="eyebrow">วันนี้ · วันที่ ${i+1} จาก 19</span><h2>${today[2]}</h2><p class="muted">${today[3]}</p><label class="hint"><input type="checkbox" id="td" ${done[t]?"checked":""}> อ่านครบแล้ว</label></div>`:`<div class="card today"><span class="eyebrow">แผนอ่าน</span><p>นอกช่วงแผน 26 ต.ค. – 13 พ.ย. 69</p></div>`}
  <div class="grid2">
    <div class="card stat"><b>${PLAN.filter(p=>done[p[0]]).length}/19</b><span>วันที่อ่านครบ</span></div>
    <div class="card stat"><b>${n}</b><span>ข้อที่ทำออนไลน์แล้ว</span></div>
    <div class="card stat"><b>${fulls.length}/10</b><span>ชุดเต็มที่พร้อมใช้</span></div>
  </div>
  <div class="card coll"><h2>เริ่มตรงไหนดี</h2>
    <p>ไม่มีเวลาอ่าน ให้<b>ฝึกจากข้อสอบ</b>: ทำทีละหมวด 10–20 ข้อ อ่านเหตุผลของทุกตัวเลือกหลังตอบ แล้วกด "เฉพาะข้อที่ผิด" ทวนก่อนนอน</p>
    <p>มีเวลาเต็มวัน (7–8 พ.ย.) ให้<b>พิมพ์ชุดเต็ม</b> ทำตามเวลาจริง แล้วกรอกคำตอบในหน้า "ตรวจกระดาษคำตอบ" หรือถ่ายรูปส่งให้ Claude ตรวจ</p>
    <div class="acts"><a class="btn pri" href="#exams">ไปที่ข้อสอบ</a><a class="btn" href="#sheets">ชีทอ่าน</a></div></div>
  </div>`;
}
function vExams(){
  const res=(c,p)=>{const g=store.get(scoreKey(c,p),null);if(!g)return"";const pct=Math.round(g.ok/g.n*100);return `<span class="score-chip ${g.pass?"pass":"fail"}">ตรวจล่าสุด ${g.ok}/${g.n} (${pct}%)</span>`};
  const block=c=>`<div class="card coll"><div class="h"><h2>${c.title}</h2><span class="muted">${c.count} ข้อ</span></div><p class="hint">${c.desc||""}</p><div class="parts">${
    Object.keys(c.parts).map(p=>`<div class="part"><div class="lbl"><span>${c.parts[p].label}</span>${res(c.id,p)}</div><div class="acts">
      <a class="btn pri" href="#q/${c.id}/${p}">ทำออนไลน์</a>
      <a class="btn" href="print.html?c=${c.id}&p=${p}&m=exam" target="_blank" rel="noopener">พิมพ์ข้อสอบ</a>
      <a class="btn" href="#g/${c.id}/${p}">ตรวจกระดาษคำตอบ</a>
      <a class="btn" href="print.html?c=${c.id}&p=${p}&m=key" target="_blank" rel="noopener">พิมพ์เฉลย</a></div></div>`).join("")}</div></div>`;
  const full=M.collections.filter(c=>c.kind==="full"),other=M.collections.filter(c=>c.kind!=="full");
  const missing=[];for(let k=1;k<=10;k++)if(!full.find(c=>c.no===k))missing.push(k);
  return `<div class="stack"><h2>ข้อสอบเต็มชุด (ภาค ก 200 + ภาค ข 200 ข้อ)</h2>
  <p class="hint">จำนวนข้อตามคะแนนเต็มในประกาศ ถือว่า 1 ข้อ = 1 คะแนน · ต้องได้ 60% ขึ้นไปทุกภาค · ลำดับตัวเลือกบนกระดาษตรงกับบนเว็บ</p>
  ${full.map(block).join("")}
  ${missing.length?`<p class="pending card coll">ชุดที่ ${missing.join(", ")} กำลังจัดทำ จะขึ้นในหน้านี้เมื่อพร้อม</p>`:""}
  <h2 style="margin-top:12px">ชุดฝึกตามหัวข้อ</h2>${other.map(block).join("")}</div>`;
}
function vSheets(){
  const parts={A:"ภาค ก",B:"ภาค ข"};
  return `<div class="stack"><h2>ชีทอ่าน (พิมพ์ได้)</h2><p class="hint">แต่ละชีทอ่านจบใน 15–25 นาที เน้นจุดที่ข้อสอบชอบพลิก · กดเปิดแล้วใช้ปุ่มพิมพ์ด้านบนของชีท</p>
  ${M.sheets.length?M.sheets.map(s=>`<div class="card sheetrow"><div><span class="eyebrow">${parts[s.part]}</span><h3>${s.title}</h3></div><a class="btn pri" href="sheets/${s.id}.html" target="_blank" rel="noopener">อ่าน / พิมพ์</a></div>`).join(""):`<p class="pending card coll">ชีทกำลังจัดทำ</p>`}</div>`;
}
function vPlan(){
  const d=store.get("ks-plan",{}),t=todayISO();
  return `<div class="stack"><p class="tip"><b>ทุกวัน</b> · คิดวิเคราะห์ 20 ข้อจับเวลา + อังกฤษ 10 ข้อ จากข้อสอบบนเว็บนี้ · วันธรรมดา ~1–2 ชม. เสาร์–อาทิตย์ 4–6 ชม.</p>${PLAN.map(([iso,lab,main,sub],i)=>`<label class="card day${iso===t?" today":""}${d[iso]?" done":""}"><input type="checkbox" data-iso="${iso}" ${d[iso]?"checked":""}><span class="d">วันที่ ${i+1}<small>${lab}</small></span><span class="t"><span>${main}</span><span class="sub">${sub}</span></span></label>`).join("")}</div>`;
}
function vTech(){
  return `<div class="stack"><div class="card pat"><h2>ทำทุกข้อด้วย 5 ขั้น</h2><ol style="margin:0;padding-left:1.3em;display:grid;gap:6px">
  <li><b>ขีดคำสำคัญ:</b> ไม่ · ยกเว้น · ที่สุด · อันดับแรก · แน่นอน · อาจ</li><li><b>ตอบในใจก่อนดูตัวเลือก</b></li><li><b>ใส่เครื่องหมายทุกตัวเลือก</b> ✓ / ✗ / ? (บนเว็บใช้ปุ่ม "ตัด")</li><li><b>เหลือ 2 ข้อ</b> เลือกข้อที่ตอบโจทย์ตรงกว่าและครอบคลุมกว่า</li><li><b>ไม่เว้นว่าง</b></li></ol></div>
  ${PATS.map((p,i)=>`<div class="card pat"><span class="eyebrow">แบบที่ ${i+1}</span><h3>${p[0]}</h3><p class="muted">${p[1]}</p><p class="how">${p[2]}</p></div>`).join("")}</div>`;
}
async function getItems(cid){if(!cache[cid])cache[cid]=await loadCollection(cid);return cache[cid]}
async function vQuiz(cid,part){
  const c=M.collections.find(x=>x.id===cid);if(!c)return`<p>ไม่พบชุดนี้</p>`;
  const items=partItems(await getItems(cid),part);
  setTimeout(()=>mountQuiz(c,part,items),0);
  return `<div class="stack"><a class="hint" href="#exams">← กลับไปหน้าข้อสอบ</a><h2>${c.title} · ${c.parts[part].label}</h2><div id="quiz" class="stack"></div></div>`;
}
function mountQuiz(c,part,items){
  const root=document.getElementById("quiz");if(!root)return;
  const subs=[...new Set(items.map(q=>q.s))];
  let filter="all",onlyWrong=false,limit=20;
  root.innerHTML=`<div class="card bar"><span class="score" id="sc"></span><span class="acts"><button class="btn" id="ow" aria-pressed="false">เฉพาะข้อที่ผิด</button><button class="btn" id="rs">เริ่มใหม่</button></span></div>
  ${subs.length>1?`<div class="chips" id="fl"><button class="chip" data-f="all" aria-pressed="true">ทั้งหมด</button>${subs.map(s=>`<button class="chip" data-f="${s}" aria-pressed="false">${SUBJ[s][1]} (${items.filter(q=>q.s===s).length})</button>`).join("")}</div>`:""}
  <p class="hint">กด "ตัด" ข้อที่ผิดแน่ ๆ ก่อน แล้วค่อยเลือกคำตอบ · หลังตอบจะเห็นเหตุผลของทุกตัวเลือก</p><div id="list" class="stack"></div><button class="btn" id="more" hidden>แสดงเพิ่มอีก 20 ข้อ</button>`;
  const list=root.querySelector("#list"),more=root.querySelector("#more");
  function draw(){
    const ans=store.get("ks-ans",{});list.innerHTML="";
    const shown=items.map((q,i)=>[q,i]).filter(([q])=>(filter==="all"||q.s===filter)&&(!onlyWrong||(ans[q.id]!==undefined&&ans[q.id]!==q.a)));
    shown.slice(0,limit).forEach(([q,i])=>list.appendChild(card(q,i+1,ans,draw)));
    more.hidden=shown.length<=limit;
    if(!shown.length)list.innerHTML=`<p class="card q muted">${onlyWrong?"ยังไม่มีข้อที่ตอบผิด":"ไม่มีข้อในหมวดนี้"}</p>`;
    const dn=items.filter(q=>ans[q.id]!==undefined).length,ok=items.filter(q=>ans[q.id]===q.a).length;
    root.querySelector("#sc").innerHTML=`ถูก <b>${ok}</b> / ${dn} ข้อที่ทำ · ทั้งหมด ${items.length}`;
  }
  more.onclick=()=>{limit+=20;draw()};
  root.querySelector("#fl")?.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;limit=20;root.querySelectorAll("#fl .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  root.querySelector("#ow").onclick=e=>{onlyWrong=!onlyWrong;limit=20;e.currentTarget.setAttribute("aria-pressed",onlyWrong);draw()};
  root.querySelector("#rs").onclick=()=>{const a=store.get("ks-ans",{});items.forEach(q=>delete a[q.id]);store.set("ks-ans",a);draw()};
  draw();
}
function card(q,no,ans,redraw){
  const pick=ans[q.id],done=pick!==undefined,order=orderOf(q);
  const el=document.createElement("article");el.className="card q";
  el.innerHTML=`<div class="meta"><span class="num">ข้อ ${no}</span><span class="tag">${SUBJ[q.s][1]}</span><span class="tag pt">${esc(q.p)}</span></div>${q.ps?`<p class="passage">${esc(q.ps)}</p>`:""}<p>${q.q}</p>`;
  if(q.code){const pre=document.createElement("pre");pre.className="code";pre.textContent=q.code;el.appendChild(pre)}
  const box=document.createElement("div");box.className="choices";
  order.forEach((ci,pos)=>{
    const row=document.createElement("div");row.className="row";
    const b=document.createElement("button");b.type="button";b.className="ch";
    b.innerHTML=`<span class="bub" aria-hidden="true">${TH[pos]}</span><span class="txt"><span></span></span>`;
    b.querySelector(".txt>span").textContent=q.c[ci];
    if(done){b.disabled=true;if(ci===q.a)b.classList.add("right");if(ci===pick){b.classList.add("pick");if(ci!==q.a)b.classList.add("wrong")}
      const nt=document.createElement("span");nt.className="note";nt.textContent=q.n[ci];b.querySelector(".txt").appendChild(nt)}
    b.onclick=()=>{const a=store.get("ks-ans",{});a[q.id]=ci;store.set("ks-ans",a);redraw()};
    row.appendChild(b);
    if(!done){const c=document.createElement("button");c.type="button";c.className="cut";c.textContent="ตัด";c.setAttribute("aria-label","ตัดตัวเลือก "+TH[pos]);c.onclick=()=>{row.classList.toggle("isCut");c.textContent=row.classList.contains("isCut")?"คืน":"ตัด"};row.appendChild(c)}
    box.appendChild(row);
  });
  el.appendChild(box);
  if(done){const r=document.createElement("p");r.className="res "+(pick===q.a?"ok":"no");r.textContent=pick===q.a?"ถูก":"ยังไม่ถูก · คำตอบคือ "+TH[order.indexOf(q.a)];el.appendChild(r);
    const t=document.createElement("p");t.className="tip";t.innerHTML="<b>เทคนิค</b> · ";t.appendChild(document.createTextNode(q.tip));el.appendChild(t)}
  return el;
}
async function vGrade(cid,part){
  const c=M.collections.find(x=>x.id===cid);if(!c)return`<p>ไม่พบชุดนี้</p>`;
  const items=partItems(await getItems(cid),part);
  setTimeout(()=>mountGrade(c,part,items),0);
  return `<div class="stack"><a class="hint" href="#exams">← กลับไปหน้าข้อสอบ</a><h2>ตรวจกระดาษคำตอบ · ${c.title} · ${c.parts[part].label}</h2><div id="grade" class="stack"></div></div>`;
}
function mountGrade(c,part,items){
  const root=document.getElementById("grade");if(!root)return;const N=items.length;
  const draftK="ks-draft-"+c.id+"-"+part;
  root.innerHTML=`<div class="card coll"><p>พิมพ์คำตอบจากกระดาษ ${N} ข้อ ได้ 2 แบบ</p><ul class="hint" style="margin:0;padding-left:1.2em"><li>ระบุเลขข้อ: <code>1ก 2ค 3ง 4ข</code> (เว้นข้อที่ไม่ได้ทำได้)</li><li>หรือพิมพ์เรียงต่อกัน: <code>กคงข…</code> ใช้ <code>-</code> แทนข้อที่เว้น</li></ul>
  <textarea id="ta" placeholder="1ก 2ค 3ง …"></textarea><div class="acts"><button class="btn pri" id="go">ตรวจคำตอบ</button><span class="hint" id="cnt"></span></div></div><div id="out" class="stack"></div>`;
  const ta=root.querySelector("#ta");ta.value=store.get(draftK,"");
  const upd=()=>{const m=parseAnswers(ta.value,N);root.querySelector("#cnt").textContent="อ่านได้ "+Object.keys(m).length+" / "+N+" ข้อ";store.set(draftK,ta.value)};
  ta.oninput=upd;upd();
  root.querySelector("#go").onclick=()=>{
    const m=parseAnswers(ta.value,N),out=root.querySelector("#out");
    let ok=0;const bySub={};const wrong=[];
    items.forEach((q,i)=>{const no=i+1,k=keyOf(q),g=m[no];bySub[q.s]=bySub[q.s]||[0,0];bySub[q.s][1]++;if(g===k){ok++;bySub[q.s][0]++}else wrong.push([q,no,g,k])});
    const pass=Object.values(bySub).every(([a,n])=>a/n>=.6)&&ok/N>=.6;
    store.set(scoreKey(c.id,part),{ok,n:N,pass,at:Date.now()});
    out.innerHTML=`<div class="card coll"><h2>${ok} / ${N} คะแนน (${Math.round(ok/N*100)}%)</h2><p class="res ${ok/N>=.6?"ok":"no"}">${ok/N>=.6?"ผ่านเกณฑ์ 60% ของภาคนี้":"ยังไม่ถึงเกณฑ์ 60% ของภาคนี้ (ต้องได้ "+Math.ceil(N*.6)+")"}</p>
    ${Object.entries(bySub).map(([s,[a,n]])=>`<div class="subj"><span>${SUBJ[s][1]}</span><b>${a}/${n} (${Math.round(a/n*100)}%)</b><span class="meter"><i class="${a/n<.6?"low":""}" style="width:${a/n*100}%"></i></span></div>`).join("")}
    <p class="hint">เส้นตรงกลางแถบคือ 60%</p></div>
    <div class="card coll"><h2>ข้อที่ผิดหรือเว้น (${wrong.length})</h2>${wrong.map(([q,no,g,k])=>{const o=orderOf(q);return `<details class="wq"><summary>ข้อ ${no} · ตอบ ${g===undefined?"เว้น":TH[g]} · เฉลย ${TH[k]} · ${SUBJ[q.s][1]}</summary><div class="stack" style="margin-top:8px">${q.ps?`<p class="passage">${esc(q.ps)}</p>`:""}<p>${q.q}</p>${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}${o.map((ci,pos)=>`<p class="${ci===q.a?"res ok":""}">${TH[pos]}. ${esc(q.c[ci])}<br><span class="hint">${esc(q.n[ci])}</span></p>`).join("")}<p class="tip"><b>เทคนิค</b> · ${esc(q.tip)}</p></div></details>`}).join("")||"<p>ไม่มี ยอดเยี่ยม</p>"}</div>`;
    out.scrollIntoView({behavior:"smooth"});
  };
}

/* ---------- router ---------- */
async function route(){
  const h=(location.hash||"#home").slice(1).split("/");const v=h[0]||"home";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===v||(a.dataset.v==="exams"&&(v==="q"||v==="g"))));
  const el=document.getElementById("view");
  let html="";
  try{
    if(v==="home")html=await vHome();else if(v==="exams")html=vExams();else if(v==="sheets")html=vSheets();else if(v==="plan")html=vPlan();else if(v==="tech")html=vTech();
    else if(v==="q")html=await vQuiz(h[1],h[2]);else if(v==="g")html=await vGrade(h[1],h[2]);else html=await vHome();
  }catch(e){html=`<p class="card coll">โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</p>`}
  el.innerHTML=html+`<footer>ข้อสอบบนเว็บนี้เขียนขึ้นเพื่อฝึกรูปแบบการพลิกโจทย์ตามหลักสูตรสอบของ ก.ค.ศ. ไม่ใช่ข้อสอบจริง · ความคืบหน้าเก็บในเบราว์เซอร์นี้เท่านั้น</footer>`;
  el.querySelectorAll("input[data-iso]").forEach(cb=>cb.onchange=()=>{const d=store.get("ks-plan",{});d[cb.dataset.iso]=cb.checked;store.set("ks-plan",d);route()});
  const td=el.querySelector("#td");if(td)td.onchange=()=>{const d=store.get("ks-plan",{});d[todayISO()]=td.checked;store.set("ks-plan",d)};
  if(v!=="q"&&v!=="g")window.scrollTo(0,0);
}
(function(){const el=document.getElementById("cd"),t=Date.parse("2026-11-14T09:00:00+07:00");
 function tick(){const ms=t-Date.now();if(ms<=0)return;const dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5);el.textContent=`ภาค ก เสาร์ 14 พ.ย. 69 เวลา 09.00 น. · อีก ${dd} วัน ${hh} ชม.`}
 tick();setInterval(tick,60000)})();
addEventListener("hashchange",route);
loadManifest().then(m=>{M=m;route()}).catch(()=>{document.getElementById("view").innerHTML='<p class="card coll">โหลดข้อมูลไม่สำเร็จ</p>'});
</script>
