<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · ชีทอ่าน ติวครูผู้ช่วย คอมฯ สระแก้ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
@page{size:A4;margin:13mm 14mm 15mm}
*{box-sizing:border-box}
html,body{margin:0;background:#E9EBEF;color:#000}
body{font-family:"Sarabun","Noto Sans Thai",sans-serif;font-size:11.5pt;line-height:1.55}
.toolbar{position:sticky;top:0;z-index:5;background:#111A3A;color:#fff;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
.toolbar button,.toolbar a{font:700 14px "Sarabun",sans-serif;background:#F0C063;color:#111A3A;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none}
.toolbar a.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.paper{max-width:210mm;margin:12px auto;background:#fff;padding:13mm 14mm;box-shadow:0 1px 4px rgba(0,0,0,.15)}
@media (max-width:820px){.paper{padding:16px}}
@media print{html,body{background:#fff}.toolbar{display:none}.paper{margin:0;padding:0;box-shadow:none;max-width:none}}
h1{font-size:16pt;margin:0 0 3mm;border-bottom:1.5pt solid #000;padding-bottom:2mm}
h2{font-size:13pt;margin:5mm 0 1.5mm;break-after:avoid;border-left:3pt solid #000;padding-left:2mm}
h3{font-size:11.5pt;margin:2.5mm 0 1mm;break-after:avoid}
p{margin:1mm 0}
ul,ol{margin:1mm 0;padding-left:6mm}
li{margin:.6mm 0}
table{border-collapse:collapse;width:100%;margin:1.5mm 0;font-size:10.5pt;break-inside:avoid}
th,td{border:.6pt solid #555;padding:1mm 1.6mm;text-align:left;vertical-align:top}
th{background:#eee}
code{font-family:"IBM Plex Mono",Menlo,monospace;font-size:9.8pt;background:#f2f2f2;padding:0 1mm}
.ex{border:.8pt dashed #000;padding:2mm 3mm;margin:2mm 0;break-inside:avoid;font-size:10.8pt}
.note{background:#f2f2f2;padding:2mm 3mm;margin:2mm 0}
.wrapx{overflow-x:auto}
</style>
</head>
<body>
<div class="toolbar"><button type="button" onclick="window.print()">พิมพ์ / บันทึก PDF</button><a class="sec" href="../index.html#sheets">กลับหน้าชีท</a></div>
<div class="paper"><h1>{{TITLE}}</h1>
{{BODY}}
</div>
</body>
</html>
